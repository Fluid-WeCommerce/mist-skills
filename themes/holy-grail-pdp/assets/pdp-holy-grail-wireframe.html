  border-radius: var(--radius-full);

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;

&lt;body&gt;
&lt;div id=&quot;pdp-holy-grail-art-directed&quot;&gt;
  &lt;style&gt;
    #pdp-holy-grail-art-directed {
      --attention: var(--viz-series-1);
      --desire: var(--viz-series-2);
      --belief: var(--viz-series-3);
      --action: var(--viz-series-4);
      width: 100%;
      color: var(--foreground);
    }
    #pdp-holy-grail-art-directed * { box-sizing: border-box; }
    #pdp-holy-grail-art-directed .topline {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: end;
      padding: 0 0 16px;
      border-bottom: 1px solid var(--border);
    }
    #pdp-holy-grail-art-directed .topline-copy {

      flex-wrap: wrap;

    #pdp-holy-grail-art-directed .topline-copy i {

    #pdp-holy-grail-art-directed .chapter-index {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      margin: 14px 0 28px;
      border-bottom: 1px solid var(--border);
    }
    #pdp-holy-grail-art-directed .chapter {
      position: relative;
      padding: 12px 10px;
      border-top: 4px solid var(--chapter-color);
      color: var(--muted-foreground);
      text-align: center;
    }
    #pdp-holy-grail-art-directed .chapter b {
      display: block;
      color: var(--foreground);
      font-weight: 500;
    }
    #pdp-holy-grail-art-directed .spread {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(235px, .34fr);
      gap: 0 20px;
      align-items: stretch;
    }
    #pdp-holy-grail-art-directed .page {
      min-width: 0;
      overflow: hidden;
      border-right: 1px solid var(--border);
      border-left: 1px solid var(--border);

    #pdp-holy-grail-art-directed .page-section {

    }

      background: color-mix(in srgb, var(--section-color) 8%, var(--background));
    }
    #pdp-holy-grail-art-directed .section-id {

      gap: 14px;
      margin-bottom: 18px;
      color: var(--muted-foreground);

    }
    #pdp-holy-grail-art-directed .section-id span:last-child { text-align: right; }
    #pdp-holy-grail-art-directed .note {
      position: relative;
      align-self: center;
      min-width: 0;
      padding: 20px 0 20px 18px;
      color: var(--muted-foreground);
    }
    #pdp-holy-grail-art-directed .note::before {
      content: &quot;&quot;;
      position: absolute;
      top: 29px;
      left: -20px;
      width: 26px;
      border-top: 1px solid var(--note-color);
    }
    #pdp-holy-grail-art-directed .note strong {
      display: block;
      margin-bottom: 6px;
      color: var(--foreground);
      font-weight: 500;
    }
    #pdp-holy-grail-art-directed .note p { margin: 0; }
    #pdp-holy-grail-art-directed .note .rule {
      display: block;
      margin-top: 10px;
      padding-top: 9px;
      border-top: 1px solid var(--border);
      color: var(--foreground);
    }
    #pdp-holy-grail-art-directed .psychology {
      display: block;
      margin-top: 14px;
      padding-top: 13px;
      border-top: 3px solid var(--note-color);
    }
    #pdp-holy-grail-art-directed .psychology summary {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: start;
      color: var(--foreground);
      cursor: pointer;
      list-style: none;
    }
    #pdp-holy-grail-art-directed .psychology summary::-webkit-details-marker { display: none; }
    #pdp-holy-grail-art-directed .psychology summary::after {
      content: &quot;+&quot;;
      flex: 0 0 auto;
      color: var(--note-color);
      font-weight: 500;

    #pdp-holy-grail-art-directed .psychology[open] summary::after { content: &quot;−&quot;; }
    #pdp-holy-grail-art-directed .psychology-label {
      color: var(--foreground);
      font-weight: 500;
      letter-spacing: .04em;
    }
    #pdp-holy-grail-art-directed .psychology-copy {
      display: grid;
      gap: 7px;
      padding-top: 9px;
    }
    #pdp-holy-grail-art-directed .psychology p { margin: 0; }
    #pdp-holy-grail-art-directed .psychology b {
      color: var(--foreground);
      font-weight: 500;
    }
    #pdp-holy-grail-art-directed .note.blank { visibility: hidden; }
    #pdp-holy-grail-art-directed .notes-off .spread {
      grid-template-columns: minmax(0, 1fr);
    }
    #pdp-holy-grail-art-directed .notes-off .note { display: none; }
    #pdp-holy-grail-art-directed .wire-line {
      height: 9px;
      border-radius: 999px;
      background: var(--muted);
    }

      background: var(--foreground);
      opacity: .78;
    }
    #pdp-holy-grail-art-directed .wire-line.w85 { width: 85%; }
    #pdp-holy-grail-art-directed .wire-line.w70 { width: 70%; }
    #pdp-holy-grail-art-directed .wire-line.w55 { width: 55%; }
    #pdp-holy-grail-art-directed .wire-line.w40 { width: 40%; }
    #pdp-holy-grail-art-directed .wire-stack { display: grid; gap: 8px; }
    #pdp-holy-grail-art-directed .frame {
      border: 1px solid var(--border);
      background: color-mix(in srgb, var(--muted) 50%, var(--background));
    }
    #pdp-holy-grail-art-directed .nav-shell { padding: 0; }
    #pdp-holy-grail-art-directed .offer-line {
      padding: 8px 14px;
      border-bottom: 1px solid var(--border);
      text-align: center;
      background: color-mix(in srgb, var(--action) 13%, var(--background));
      color: var(--foreground);
    }
    #pdp-holy-grail-art-directed .nav-line {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 18px;
      align-items: center;
      padding: 14px 18px;
    }
    #pdp-holy-grail-art-directed .mark {
      width: 72px;
      height: 18px;
      border-radius: 2px;
      background: var(--foreground);
    }
    #pdp-holy-grail-art-directed .nav-center {
      display: flex;
      justify-content: center;
      gap: 15px;
    }
    #pdp-holy-grail-art-directed .nav-center i {

      height: 7px;

      background: var(--muted);

      height: 18px;
      border: 1px solid var(--border);
      border-radius: 50%;

    #pdp-holy-grail-art-directed .hero {

      display: grid;

        linear-gradient(145deg,

          color-mix(in srgb, var(--desire) 13%, var(--muted)));

      gap: 20px;
      align-items: center;

      display: grid;
      place-items: center;

      border: 1px solid var(--border);
      border-radius: 50%;

    #pdp-holy-grail-art-directed .satellite {

      z-index: 3;
      width: 27%;
      aspect-ratio: 1;

      place-items: center;
      border-radius: 50%;

    #pdp-holy-grail-art-directed .satellite.two { top: 37%; right: 1%; }
    #pdp-holy-grail-art-directed .satellite.three { bottom: 1%; left: 36%; }
    #pdp-holy-grail-art-directed .satellite.four { top: 37%; left: 1%; }
    #pdp-holy-grail-art-directed .mechanism-copy { display: grid; gap: 14px; }
    #pdp-holy-grail-art-directed .reason {
      display: grid;
      grid-template-columns: 30px 1fr;
      gap: 10px;
      align-items: start;
    }
    #pdp-holy-grail-art-directed .reason i {
      width: 30px;
      height: 30px;
      border-radius: 50%;

    &lt;div class=&quot;spread&quot; style=&quot;--note-color:var(--attention)&quot;&gt;
      &lt;main class=&quot;page&quot;&gt;
        &lt;section class=&quot;page-section nav-shell&quot;&gt;
          &lt;div class=&quot;offer-line&quot;&gt;One precise offer, shipping promise, or deadline&lt;/div&gt;
          &lt;div class=&quot;nav-line&quot;&gt;&lt;i class=&quot;mark&quot;&gt;&lt;/i&gt;&lt;div class=&quot;nav-center&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;/div&gt;&lt;div class=&quot;nav-actions&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;/section&gt;
      &lt;/main&gt;
      &lt;aside class=&quot;note&quot;&gt;&lt;strong&gt;Restraint is the first design decision&lt;/strong&gt;&lt;p&gt;Give the logo, cart, search, account, and essential paths room to breathe.&lt;/p&gt;&lt;span class=&quot;rule&quot;&gt;No rotating announcement carousel.&lt;/span&gt;&lt;details class=&quot;psychology&quot;&gt;&lt;summary&gt;&lt;span class=&quot;psychology-label text-small&quot;&gt;PSYCHOLOGY · COGNITIVE EASE + GOAL GRADIENT&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;psychology-copy&quot;&gt;&lt;p&gt;&lt;b&gt;Shopper thought:&lt;/b&gt; “Can I find what I need—and am I close to a reward?”&lt;/p&gt;&lt;p&gt;&lt;b&gt;Script mirror:&lt;/b&gt; Simplify navigation, compress the first load, and set a free-shipping threshold just above current AOV so progress feels attainable.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/aside&gt;
    &lt;/div&gt;

    &lt;div class=&quot;spread&quot; style=&quot;--note-color:var(--attention)&quot;&gt;
      &lt;main class=&quot;page&quot;&gt;
        &lt;section class=&quot;page-section hero&quot;&gt;
          &lt;div class=&quot;hero-media&quot;&gt;
            &lt;div class=&quot;media-rail&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;i&gt;&lt;/i&gt;&lt;/div&gt;
            &lt;div class=&quot;hero-ring&quot;&gt;&lt;/div&gt;&lt;div class=&quot;hero-product&quot;&gt;&lt;/div&gt;
            &lt;div class=&quot;hero-caption&quot;&gt;&lt;span&gt;PRODUCT IN CONTEXT&lt;/span&gt;&lt;span&gt;DETAIL · SCALE · USE&lt;/span&gt;&lt;/div&gt;
          &lt;/div&gt;
          &lt;div class=&quot;buy-panel&quot;&gt;
            &lt;div class=&quot;section-id&quot;&gt;&lt;span&gt;01 / DECISION&lt;/span&gt;&lt;span&gt;ABOVE THE FOLD&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;rating&quot;&gt;★★★★★ 4.8 · 2,418 reviews&lt;/div&gt;
            &lt;div class=&quot;wire-stack&quot;&gt;&lt;div class=&quot;wire-line ink w85&quot;&gt;&lt;/div&gt;&lt;div class=&quot;wire-line&quot;&gt;&lt;/div&gt;&lt;div class=&quot;wire-line w70&quot;&gt;&lt;/div&gt;&lt;/div&gt;
            &lt;div class=&quot;price-row&quot;&gt;&lt;strong&gt;$00 · or $00/mo&lt;/strong&gt;&lt;span class=&quot;save&quot;&gt;SAVE 15%&lt;/span&gt;&lt;/div&gt;
            &lt;span class=&quot;text-small text-muted&quot;&gt;Variant → quantity → purchase mode&lt;/span&gt;
            &lt;div class=&quot;choices&quot;&gt;&lt;span class=&quot;choice selected&quot;&gt;Option A&lt;/span&gt;&lt;span class=&quot;choice&quot;&gt;Option B&lt;/span&gt;&lt;span class=&quot;choice&quot;&gt;Option C&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;mode selected&quot;&gt;&lt;i class=&quot;radio&quot;&gt;&lt;/i&gt;&lt;span&gt;Best-value choice&lt;br&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;Cadence + cancellation&lt;/span&gt;&lt;/span&gt;&lt;strong&gt;$00&lt;/strong&gt;&lt;/div&gt;
            &lt;div class=&quot;mode&quot;&gt;&lt;i class=&quot;radio&quot;&gt;&lt;/i&gt;&lt;span&gt;One-time purchase&lt;/span&gt;&lt;strong&gt;$00&lt;/strong&gt;&lt;/div&gt;
            &lt;div class=&quot;cta&quot;&gt;CHOOSE OPTION · $00&lt;/div&gt;
            &lt;div class=&quot;risk-row&quot;&gt;&lt;span&gt;Delivery&lt;/span&gt;&lt;span&gt;Guarantee&lt;/span&gt;&lt;span&gt;Returns&lt;/span&gt;&lt;/div&gt;
          &lt;/div&gt;
        &lt;/section&gt;
      &lt;/main&gt;
      &lt;aside class=&quot;note&quot;&gt;&lt;strong&gt;One visual thesis&lt;/strong&gt;&lt;p&gt;Art-direct one memorable product moment, then let the purchase panel behave like a disciplined instrument.&lt;/p&gt;&lt;span class=&quot;rule&quot;&gt;Show → name → configure → de-risk → buy.&lt;/span&gt;&lt;details class=&quot;psychology&quot; open&gt;&lt;summary&gt;&lt;span class=&quot;psychology-label text-small&quot;&gt;PSYCHOLOGY · MESSAGE MATCH + CHOICE ARCHITECTURE&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;psychology-copy&quot;&gt;&lt;p&gt;&lt;b&gt;Shopper thought:&lt;/b&gt; “Is this what I clicked, and which option is right for me?”&lt;/p&gt;&lt;p&gt;&lt;b&gt;Script mirror:&lt;/b&gt; Repeat the ad’s product, promise, and visual on first load; then make review proof, offer value, purchase mode, delivery, and guarantee scannable in one decision view.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/aside&gt;
    &lt;/div&gt;

    &lt;div class=&quot;spread&quot; style=&quot;--note-color:var(--belief)&quot;&gt;
      &lt;main class=&quot;page&quot;&gt;
        &lt;section class=&quot;page-section proof-ticker&quot;&gt;
          &lt;span&gt;THE TRUST BAR&lt;/span&gt;&lt;span&gt;50K+ customers&lt;/span&gt;&lt;span&gt;Verified reviews&lt;/span&gt;&lt;span&gt;Clinical / award / expert&lt;/span&gt;
        &lt;/section&gt;
      &lt;/main&gt;
      &lt;aside class=&quot;note&quot;&gt;&lt;strong&gt;Proof behaves like punctuation&lt;/strong&gt;&lt;p&gt;Use a clean, high-contrast interruption immediately after the offer.&lt;/p&gt;&lt;span class=&quot;rule&quot;&gt;Two strong signals beat ten logos.&lt;/span&gt;&lt;details class=&quot;psychology&quot;&gt;&lt;summary&gt;&lt;span class=&quot;psychology-label text-small&quot;&gt;PSYCHOLOGY · SOCIAL PROOF + AUTHORITY BIAS&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;psychology-copy&quot;&gt;&lt;p&gt;&lt;b&gt;Shopper thought:&lt;/b&gt; “Do credible people—and enough people—believe this works?”&lt;/p&gt;&lt;p&gt;&lt;b&gt;Script mirror:&lt;/b&gt; Pair verified customer volume with one recognizable expert, clinician, publisher, award, or retailer. Borrowed credibility lowers resistance fastest when it sits beside the promise.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/aside&gt;
    &lt;/div&gt;

    &lt;div class=&quot;spread&quot; style=&quot;--note-color:var(--desire)&quot;&gt;
      &lt;main class=&quot;page&quot;&gt;
        &lt;section class=&quot;page-section contrast&quot;&gt;
          &lt;div class=&quot;state before&quot;&gt;&lt;div class=&quot;orb&quot;&gt;&lt;/div&gt;&lt;div class=&quot;section-id&quot;&gt;&lt;span&gt;02A / BEFORE&lt;/span&gt;&lt;span&gt;FRICTION&lt;/span&gt;&lt;/div&gt;&lt;b&gt;Name the old frustration&lt;/b&gt;&lt;span class=&quot;text-muted&quot;&gt;Make the present state recognizable.&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;state after&quot;&gt;&lt;div class=&quot;orb&quot;&gt;&lt;/div&gt;&lt;div class=&quot;section-id&quot;&gt;&lt;span&gt;02B / AFTER&lt;/span&gt;&lt;span&gt;DESIRE&lt;/span&gt;&lt;/div&gt;&lt;b&gt;Show the transformed state&lt;/b&gt;&lt;span class=&quot;text-muted&quot;&gt;Let the outcome feel immediate and specific.&lt;/span&gt;&lt;/div&gt;
        &lt;/section&gt;
      &lt;/main&gt;
      &lt;aside class=&quot;note&quot;&gt;&lt;strong&gt;Create an editorial turn&lt;/strong&gt;&lt;p&gt;The diagonal split changes tempo and makes the transformation physical—not just verbal.&lt;/p&gt;&lt;span class=&quot;rule&quot;&gt;The product must visibly cause the after-state.&lt;/span&gt;&lt;details class=&quot;psychology&quot;&gt;&lt;summary&gt;&lt;span class=&quot;psychology-label text-small&quot;&gt;PSYCHOLOGY · PROBLEM RECOGNITION + CONTRAST EFFECT&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;psychology-copy&quot;&gt;&lt;p&gt;&lt;b&gt;Shopper thought:&lt;/b&gt; “That is my frustration—can I picture a meaningfully better state?”&lt;/p&gt;&lt;p&gt;&lt;b&gt;Script mirror:&lt;/b&gt; Carpe’s pain-first hooks and demo-led transformations work because the buyer recognizes themself before being asked to believe the solution.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/aside&gt;
    &lt;/div&gt;

    &lt;div class=&quot;spread&quot; style=&quot;--note-color:var(--desire)&quot;&gt;
      &lt;main class=&quot;page&quot;&gt;
        &lt;section class=&quot;page-section bleed&quot; style=&quot;--section-color:var(--desire)&quot;&gt;
          &lt;div class=&quot;section-id&quot;&gt;&lt;span&gt;03 / PAYOFF&lt;/span&gt;&lt;span&gt;BENEFITS, NOT INVENTORY&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;benefit-composition&quot;&gt;
            &lt;div class=&quot;benefit-major&quot;&gt;&lt;strong&gt;The one outcome buyers came for&lt;/strong&gt;&lt;p&gt;Give the primary benefit more space than every supporting point combined.&lt;/p&gt;&lt;/div&gt;
            &lt;div class=&quot;benefit-stack&quot;&gt;&lt;div class=&quot;benefit-minor&quot;&gt;&lt;strong&gt;A meaningful secondary result&lt;/strong&gt;&lt;p&gt;Connect it to a feature or mechanism.&lt;/p&gt;&lt;/div&gt;&lt;div class=&quot;benefit-minor&quot;&gt;&lt;strong&gt;The ease of living with it&lt;/strong&gt;&lt;p&gt;Time, taste, comfort, cleanup, or convenience.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
          &lt;/div&gt;
        &lt;/section&gt;
      &lt;/main&gt;
      &lt;aside class=&quot;note&quot;&gt;&lt;strong&gt;Hierarchy is persuasion&lt;/strong&gt;&lt;p&gt;Equal-sized benefit cards imply every point matters equally. They rarely do.&lt;/p&gt;&lt;span class=&quot;rule&quot;&gt;One major benefit. Two supporting benefits.&lt;/span&gt;&lt;details class=&quot;psychology&quot;&gt;&lt;summary&gt;&lt;span class=&quot;psychology-label text-small&quot;&gt;PSYCHOLOGY · GOAL SALIENCE + AFFECT HEURISTIC&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;psychology-copy&quot;&gt;&lt;p&gt;&lt;b&gt;Shopper thought:&lt;/b&gt; “What changes in my life—not merely what is inside the box?”&lt;/p&gt;&lt;p&gt;&lt;b&gt;Script mirror:&lt;/b&gt; Translate features into felt outcomes such as energy, taste, comfort, skin, speed, or convenience. Lead with the result the buyer already wants.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/aside&gt;
    &lt;/div&gt;

    &lt;div class=&quot;spread&quot; style=&quot;--note-color:var(--belief)&quot;&gt;
      &lt;main class=&quot;page&quot;&gt;
        &lt;section class=&quot;page-section&quot;&gt;
          &lt;div class=&quot;section-id&quot;&gt;&lt;span&gt;04 / MECHANISM&lt;/span&gt;&lt;span&gt;WHY IT WORKS&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;mechanism&quot;&gt;
            &lt;div class=&quot;mechanism-map&quot;&gt;&lt;div class=&quot;orbit&quot;&gt;&lt;/div&gt;&lt;div class=&quot;mechanism-core&quot;&gt;CORE&lt;br&gt;DIFFERENCE&lt;/div&gt;&lt;div class=&quot;satellite one&quot;&gt;Input A&lt;/div&gt;&lt;div class=&quot;satellite two&quot;&gt;Input B&lt;/div&gt;&lt;div class=&quot;satellite three&quot;&gt;Input C&lt;/div&gt;&lt;div class=&quot;satellite four&quot;&gt;Input D&lt;/div&gt;&lt;/div&gt;
            &lt;div class=&quot;mechanism-copy&quot;&gt;
              &lt;div class=&quot;wire-stack&quot;&gt;&lt;div class=&quot;wire-line ink w70&quot;&gt;&lt;/div&gt;&lt;div class=&quot;wire-line&quot;&gt;&lt;/div&gt;&lt;div class=&quot;wire-line w55&quot;&gt;&lt;/div&gt;&lt;/div&gt;
              &lt;div class=&quot;reason&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;div&gt;&lt;strong&gt;Differentiator one&lt;/strong&gt;&lt;br&gt;&lt;span&gt;Feature → shopper consequence → evidence.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
              &lt;div class=&quot;reason&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;div&gt;&lt;strong&gt;Differentiator two&lt;/strong&gt;&lt;br&gt;&lt;span&gt;Why alternatives cannot honestly match it.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
              &lt;div class=&quot;reason&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;div&gt;&lt;strong&gt;Differentiator three&lt;/strong&gt;&lt;br&gt;&lt;span&gt;Construction, sourcing, or design rationale.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
            &lt;/div&gt;
          &lt;/div&gt;
        &lt;/section&gt;
      &lt;/main&gt;
      &lt;aside class=&quot;note&quot;&gt;&lt;strong&gt;Turn complexity into a signature graphic&lt;/strong&gt;&lt;p&gt;Ingredient, material, or technology education should feel like brand design—not a textbook diagram.&lt;/p&gt;&lt;span class=&quot;rule&quot;&gt;The mechanism must be retellable in one breath.&lt;/span&gt;&lt;details class=&quot;psychology&quot;&gt;&lt;summary&gt;&lt;span class=&quot;psychology-label text-small&quot;&gt;PSYCHOLOGY · CAUSAL COHERENCE + REASON-WHY EFFECT&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;psychology-copy&quot;&gt;&lt;p&gt;&lt;b&gt;Shopper thought:&lt;/b&gt; “Why should this work, and why is it different?”&lt;/p&gt;&lt;p&gt;&lt;b&gt;Script mirror:&lt;/b&gt; Ingredient science, sourcing, construction, and a named hero mechanism turn a promise into a believable chain of cause and effect.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/aside&gt;
    &lt;/div&gt;

    &lt;div class=&quot;spread&quot; style=&quot;--note-color:var(--desire)&quot;&gt;
      &lt;main class=&quot;page&quot;&gt;
        &lt;section class=&quot;page-section&quot; style=&quot;padding-right:0;padding-left:0&quot;&gt;
          &lt;div class=&quot;section-id&quot; style=&quot;padding-right:28px;padding-left:28px&quot;&gt;&lt;span&gt;05 / RITUAL&lt;/span&gt;&lt;span&gt;OWNERSHIP REHEARSAL&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;filmstrip&quot;&gt;
            &lt;div class=&quot;film-frame&quot; data-number=&quot;1&quot;&gt;&lt;i class=&quot;motion&quot;&gt;&lt;/i&gt;&lt;strong&gt;Start&lt;/strong&gt;&lt;span&gt;Show the real input, quantity, or setup.&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;film-frame&quot; data-number=&quot;2&quot;&gt;&lt;i class=&quot;motion&quot;&gt;&lt;/i&gt;&lt;strong&gt;Use&lt;/strong&gt;&lt;span&gt;Show hands, timing, environment, and effort.&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;film-frame&quot; data-number=&quot;3&quot;&gt;&lt;i class=&quot;motion&quot;&gt;&lt;/i&gt;&lt;strong&gt;Enjoy&lt;/strong&gt;&lt;span&gt;Show the immediate experience or result.&lt;/span&gt;&lt;/div&gt;
          &lt;/div&gt;
        &lt;/section&gt;
      &lt;/main&gt;
      &lt;aside class=&quot;note&quot;&gt;&lt;strong&gt;Sequence creates confidence&lt;/strong&gt;&lt;p&gt;A filmstrip makes the ritual feel ownable before the shopper commits.&lt;/p&gt;&lt;span class=&quot;rule&quot;&gt;Answer time, effort, frequency, cleanup, and care.&lt;/span&gt;&lt;details class=&quot;psychology&quot;&gt;&lt;summary&gt;&lt;span class=&quot;psychology-label text-small&quot;&gt;PSYCHOLOGY · MENTAL SIMULATION + HABIT FORMATION&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;psychology-copy&quot;&gt;&lt;p&gt;&lt;b&gt;Shopper thought:&lt;/b&gt; “Can I see this fitting naturally into my day?”&lt;/p&gt;&lt;p&gt;&lt;b&gt;Script mirror:&lt;/b&gt; Show the hands, quantity, timing, recipes, setup, and immediate reward. Positioning the product as a simple daily routine supports both conversion and retention.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/aside&gt;
    &lt;/div&gt;

    &lt;div class=&quot;spread&quot; style=&quot;--note-color:var(--belief)&quot;&gt;
      &lt;main class=&quot;page&quot;&gt;
        &lt;section class=&quot;page-section stat-spread&quot; style=&quot;padding:0&quot;&gt;
          &lt;div class=&quot;stat-figure&quot;&gt;00%&lt;br&gt;RESULT&lt;/div&gt;
          &lt;div class=&quot;stat-copy&quot;&gt;&lt;div class=&quot;section-id&quot;&gt;&lt;span&gt;06 / EVIDENCE&lt;/span&gt;&lt;span&gt;CLAIM + CONTEXT&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;wire-line ink w85&quot;&gt;&lt;/div&gt;&lt;div class=&quot;wire-line&quot;&gt;&lt;/div&gt;&lt;div class=&quot;wire-line&quot;&gt;&lt;/div&gt;&lt;div class=&quot;wire-line w55&quot;&gt;&lt;/div&gt;&lt;span class=&quot;text-small text-muted&quot;&gt;Population · method · duration · source · limitations&lt;/span&gt;&lt;/div&gt;
        &lt;/section&gt;
      &lt;/main&gt;
      &lt;aside class=&quot;note&quot;&gt;&lt;strong&gt;Give one proof point the entire stage&lt;/strong&gt;&lt;p&gt;Large evidence is powerful only when the method and scope remain visible.&lt;/p&gt;&lt;span class=&quot;rule&quot;&gt;Never float a number without context.&lt;/span&gt;&lt;details class=&quot;psychology&quot;&gt;&lt;summary&gt;&lt;span class=&quot;psychology-label text-small&quot;&gt;PSYCHOLOGY · SPECIFICITY EFFECT + UNCERTAINTY REDUCTION&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;psychology-copy&quot;&gt;&lt;p&gt;&lt;b&gt;Shopper thought:&lt;/b&gt; “Was this measured, or is it just marketing?”&lt;/p&gt;&lt;p&gt;&lt;b&gt;Script mirror:&lt;/b&gt; Numbers such as 97%, 6 million orders, or research volume build trust; population, method, duration, source, and limits keep that trust defensible.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/aside&gt;
    &lt;/div&gt;

    &lt;div class=&quot;spread&quot; style=&quot;--note-color:var(--belief)&quot;&gt;
      &lt;main class=&quot;page&quot;&gt;
        &lt;section class=&quot;page-section bleed&quot; style=&quot;--section-color:var(--belief)&quot;&gt;
          &lt;div class=&quot;section-id&quot;&gt;&lt;span&gt;07 / DECISION&lt;/span&gt;&lt;span&gt;COMPARISON&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;table-responsive&quot;&gt;
            &lt;table class=&quot;comparison&quot; aria-label=&quot;Product comparison wireframe&quot;&gt;
              &lt;thead&gt;&lt;tr&gt;&lt;th&gt;What buyers weigh&lt;/th&gt;&lt;th&gt;Your product&lt;/th&gt;&lt;th&gt;Alternative&lt;/th&gt;&lt;/tr&gt;&lt;/thead&gt;
              &lt;tbody&gt;&lt;tr&gt;&lt;td&gt;Desired outcome&lt;/td&gt;&lt;td&gt;✓ Complete&lt;/td&gt;&lt;td&gt;Partial&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Ease and speed&lt;/td&gt;&lt;td&gt;✓ Simple&lt;/td&gt;&lt;td&gt;More steps&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Evidence&lt;/td&gt;&lt;td&gt;✓ Specific&lt;/td&gt;&lt;td&gt;Generic&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Total ownership value&lt;/td&gt;&lt;td&gt;✓ Visible&lt;/td&gt;&lt;td&gt;Hidden costs&lt;/td&gt;&lt;/tr&gt;&lt;tr&gt;&lt;td&gt;Best for&lt;/td&gt;&lt;td&gt;Core audience&lt;/td&gt;&lt;td&gt;Different need&lt;/td&gt;&lt;/tr&gt;&lt;/tbody&gt;
            &lt;/table&gt;
          &lt;/div&gt;
        &lt;/section&gt;
      &lt;/main&gt;
      &lt;aside class=&quot;note&quot;&gt;&lt;strong&gt;Honesty is premium&lt;/strong&gt;&lt;p&gt;Compare the factors buyers actually weigh and allow alternatives to win where they genuinely do.&lt;/p&gt;&lt;span class=&quot;rule&quot;&gt;Show total cost—not a cherry-picked unit.&lt;/span&gt;&lt;details class=&quot;psychology&quot;&gt;&lt;summary&gt;&lt;span class=&quot;psychology-label text-small&quot;&gt;PSYCHOLOGY · CONTRAST EFFECT + STATUS-QUO DISRUPTION&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;psychology-copy&quot;&gt;&lt;p&gt;&lt;b&gt;Shopper thought:&lt;/b&gt; “Why should I switch from what I already use?”&lt;/p&gt;&lt;p&gt;&lt;b&gt;Script mirror:&lt;/b&gt; Compare the current routine with the new one on outcome, effort, evidence, ingredients, and total value—the same logic used in coffee and energy-drink comparisons.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/aside&gt;
    &lt;/div&gt;

    &lt;div class=&quot;spread&quot; style=&quot;--note-color:var(--belief)&quot;&gt;
      &lt;main class=&quot;page&quot;&gt;
        &lt;section class=&quot;page-section&quot;&gt;
          &lt;div class=&quot;section-id&quot;&gt;&lt;span&gt;08 / COMMUNITY&lt;/span&gt;&lt;span&gt;PEOPLE LIKE ME&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;ugc-collage&quot;&gt;
            &lt;div class=&quot;ugc featured&quot;&gt;&lt;strong&gt;Specific transformation&lt;/strong&gt;&lt;span&gt;Starting point · routine · duration&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;ugc&quot;&gt;&lt;strong&gt;Fit or use context&lt;/strong&gt;&lt;span&gt;Profile · size · environment&lt;/span&gt;&lt;/div&gt;
            &lt;div class=&quot;ugc&quot;&gt;&lt;strong&gt;Tradeoff-aware review&lt;/strong&gt;&lt;span&gt;Verified · disclosed · useful&lt;/span&gt;&lt;/div&gt;
          &lt;/div&gt;
        &lt;/section&gt;
      &lt;/main&gt;
      &lt;aside class=&quot;note&quot;&gt;&lt;strong&gt;Curate proof like an editorial spread&lt;/strong&gt;&lt;p&gt;Vary scale and rhythm. The strongest story earns more real estate.&lt;/p&gt;&lt;span class=&quot;rule&quot;&gt;Context beats praise. Specificity beats volume.&lt;/span&gt;&lt;details class=&quot;psychology&quot;&gt;&lt;summary&gt;&lt;span class=&quot;psychology-label text-small&quot;&gt;PSYCHOLOGY · SELF-IDENTIFICATION + SOCIAL PROOF&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;psychology-copy&quot;&gt;&lt;p&gt;&lt;b&gt;Shopper thought:&lt;/b&gt; “Are people like me getting the outcome I want?”&lt;/p&gt;&lt;p&gt;&lt;b&gt;Script mirror:&lt;/b&gt; Raw UGC, real faces, routines, and recognizable audience identities make the product feel legitimate while letting shoppers see themselves inside the community.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/aside&gt;
    &lt;/div&gt;

    &lt;div class=&quot;spread&quot; style=&quot;--note-color:var(--action)&quot;&gt;
      &lt;main class=&quot;page&quot;&gt;
        &lt;section class=&quot;page-section bleed&quot; style=&quot;--section-color:var(--action)&quot;&gt;
          &lt;div class=&quot;section-id&quot;&gt;&lt;span&gt;09 / RESOLVE&lt;/span&gt;&lt;span&gt;OBJECTIONS + GUARANTEE&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;objection-grid&quot;&gt;
            &lt;div class=&quot;faq&quot;&gt;&lt;div class=&quot;faq-row&quot;&gt;&lt;span&gt;Will it work for my specific situation?&lt;/span&gt;&lt;span&gt;＋&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;faq-row&quot;&gt;&lt;span&gt;When will it arrive and what does shipping cost?&lt;/span&gt;&lt;span&gt;＋&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;faq-row&quot;&gt;&lt;span&gt;What if it is not right for me?&lt;/span&gt;&lt;span&gt;＋&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;faq-row&quot;&gt;&lt;span&gt;What is included, compatible, safe, or required?&lt;/span&gt;&lt;span&gt;＋&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;faq-row&quot;&gt;&lt;span&gt;How do renewal, warranty, and support work?&lt;/span&gt;&lt;span&gt;＋&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
            &lt;div class=&quot;guarantee&quot;&gt;&lt;strong&gt;Plain-language guarantee&lt;/strong&gt;&lt;span&gt;Window · eligibility · process · refund timing.&lt;/span&gt;&lt;/div&gt;
          &lt;/div&gt;
        &lt;/section&gt;
      &lt;/main&gt;
      &lt;aside class=&quot;note&quot;&gt;&lt;strong&gt;Risk reversal deserves its own visual language&lt;/strong&gt;&lt;p&gt;Do not hide the guarantee inside the FAQ. Make the commitment legible and specific.&lt;/p&gt;&lt;span class=&quot;rule&quot;&gt;Use objections from support, returns, reviews, and search.&lt;/span&gt;&lt;details class=&quot;psychology&quot;&gt;&lt;summary&gt;&lt;span class=&quot;psychology-label text-small&quot;&gt;PSYCHOLOGY · AMBIGUITY AVERSION + LOSS AVERSION&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;psychology-copy&quot;&gt;&lt;p&gt;&lt;b&gt;Shopper thought:&lt;/b&gt; “What could go wrong after I pay?”&lt;/p&gt;&lt;p&gt;&lt;b&gt;Script mirror:&lt;/b&gt; Delivery date, shipping cost, returns, guarantee, compatibility, safety, and subscription cancellation reduce the unknowns that otherwise feel like potential losses.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/aside&gt;
    &lt;/div&gt;

    &lt;div class=&quot;spread&quot; style=&quot;--note-color:var(--action)&quot;&gt;
      &lt;main class=&quot;page&quot;&gt;
        &lt;section class=&quot;page-section&quot;&gt;
          &lt;div class=&quot;section-id&quot;&gt;&lt;span&gt;10 / EXTEND&lt;/span&gt;&lt;span&gt;USEFUL CROSS-SELL&lt;/span&gt;&lt;/div&gt;
          &lt;div class=&quot;cross-sell&quot;&gt;&lt;div class=&quot;cross-item&quot;&gt;&lt;div class=&quot;cross-media&quot;&gt;ADD-ON&lt;/div&gt;&lt;strong&gt;Completes the job&lt;/strong&gt;&lt;br&gt;&lt;span&gt;One-sentence use case · $00&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cross-item&quot;&gt;&lt;div class=&quot;cross-media&quot;&gt;BUNDLE&lt;/div&gt;&lt;strong&gt;Saves time or money&lt;/strong&gt;&lt;br&gt;&lt;span&gt;Transparent bundle value · $00&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;cross-item&quot;&gt;&lt;div class=&quot;cross-media&quot;&gt;ALTERNATIVE&lt;/div&gt;&lt;strong&gt;Better for another need&lt;/strong&gt;&lt;br&gt;&lt;span&gt;Correctly redirects · $00&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;/section&gt;
      &lt;/main&gt;
      &lt;aside class=&quot;note&quot;&gt;&lt;strong&gt;Every recommendation needs a reason&lt;/strong&gt;&lt;p&gt;Complete, replenish, protect, style, or redirect. Otherwise remove it.&lt;/p&gt;&lt;span class=&quot;rule&quot;&gt;Never interrupt the core decision with random inventory.&lt;/span&gt;&lt;details class=&quot;psychology&quot;&gt;&lt;summary&gt;&lt;span class=&quot;psychology-label text-small&quot;&gt;PSYCHOLOGY · GOAL COMPLETION + VALUE ANCHORING&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;psychology-copy&quot;&gt;&lt;p&gt;&lt;b&gt;Shopper thought:&lt;/b&gt; “What completes the job without making me reconsider everything?”&lt;/p&gt;&lt;p&gt;&lt;b&gt;Script mirror:&lt;/b&gt; Bundles, threshold rewards, refills, and relevant add-ons raise AOV after intent is established because they extend the same goal and make total value visible.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/aside&gt;
    &lt;/div&gt;

    &lt;div class=&quot;spread&quot; style=&quot;--note-color:var(--action)&quot;&gt;
      &lt;main class=&quot;page&quot;&gt;
        &lt;section class=&quot;page-section finale&quot;&gt;
          &lt;div class=&quot;finale-copy&quot;&gt;&lt;div class=&quot;section-id&quot; style=&quot;color:inherit&quot;&gt;&lt;span&gt;11 / CLOSE&lt;/span&gt;&lt;span&gt;RECAP, DON’T RESTART&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;wire-line ink w85&quot;&gt;&lt;/div&gt;&lt;div class=&quot;wire-line&quot;&gt;&lt;/div&gt;&lt;div class=&quot;wire-line w55&quot;&gt;&lt;/div&gt;&lt;span&gt;★★★★★ 4.8 · Guarantee · Delivery date&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;finale-cta&quot;&gt;CHOOSE OPTION · $00&lt;/div&gt;
        &lt;/section&gt;
        &lt;footer class=&quot;page-section footer&quot;&gt;&lt;i class=&quot;mark&quot;&gt;&lt;/i&gt;&lt;span&gt;Support · Returns · Privacy · Terms · Accessibility&lt;/span&gt;&lt;/footer&gt;
      &lt;/main&gt;
      &lt;aside class=&quot;note&quot;&gt;&lt;strong&gt;Finish with certainty&lt;/strong&gt;&lt;p&gt;Repeat the selected product, best-value offer, strongest proof, and risk reversal.&lt;/p&gt;&lt;span class=&quot;rule&quot;&gt;Preserve every choice made above.&lt;/span&gt;&lt;details class=&quot;psychology&quot;&gt;&lt;summary&gt;&lt;span class=&quot;psychology-label text-small&quot;&gt;PSYCHOLOGY · DECISION MOMENTUM + COGNITIVE CLOSURE&lt;/span&gt;&lt;/summary&gt;&lt;div class=&quot;psychology-copy&quot;&gt;&lt;p&gt;&lt;b&gt;Shopper thought:&lt;/b&gt; “Do I still know exactly what I chose, what it costs, and why it is safe?”&lt;/p&gt;&lt;p&gt;&lt;b&gt;Script mirror:&lt;/b&gt; A clean drawer cart, preserved selections, familiar payment methods, delivery, and no surprise fees carry conviction forward instead of forcing a second decision.&lt;/p&gt;&lt;/div&gt;&lt;/details&gt;&lt;/aside&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;section class=&quot;mobile-translation&quot; aria-label=&quot;Mobile translation guidance&quot;&gt;
    &lt;div class=&quot;phone&quot;&gt;&lt;div class=&quot;phone-notch&quot;&gt;&lt;/div&gt;&lt;div class=&quot;phone-screen&quot;&gt;&lt;div class=&quot;phone-media&quot;&gt;&lt;/div&gt;&lt;div class=&quot;phone-body&quot;&gt;&lt;div class=&quot;wire-line w40&quot;&gt;&lt;/div&gt;&lt;div class=&quot;wire-line ink w85&quot;&gt;&lt;/div&gt;&lt;div class=&quot;wire-line&quot;&gt;&lt;/div&gt;&lt;div class=&quot;choices&quot;&gt;&lt;span class=&quot;choice selected&quot;&gt;A&lt;/span&gt;&lt;span class=&quot;choice&quot;&gt;B&lt;/span&gt;&lt;span class=&quot;choice&quot;&gt;C&lt;/span&gt;&lt;/div&gt;&lt;div class=&quot;mode selected&quot;&gt;&lt;i class=&quot;radio&quot;&gt;&lt;/i&gt;&lt;span&gt;Best value&lt;/span&gt;&lt;strong&gt;$00&lt;/strong&gt;&lt;/div&gt;&lt;/div&gt;&lt;div class=&quot;phone-sticky&quot;&gt;CHOOSE OPTION · $00&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;div class=&quot;mobile-rules&quot;&gt;
      &lt;div class=&quot;mobile-rule&quot;&gt;&lt;b&gt;1&lt;/b&gt;&lt;div&gt;&lt;strong&gt;Compress; don’t merely stack&lt;/strong&gt;&lt;p&gt;One dominant media asset, swipeable support, and tighter outcome copy.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;mobile-rule&quot;&gt;&lt;b&gt;2&lt;/b&gt;&lt;div&gt;&lt;strong&gt;Make the sticky CTA state-aware&lt;/strong&gt;&lt;p&gt;Missing options open the selector; completed options go to cart.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;mobile-rule&quot;&gt;&lt;b&gt;3&lt;/b&gt;&lt;div&gt;&lt;strong&gt;Give one layer the thumb zone&lt;/strong&gt;&lt;p&gt;Coordinate chat, cookies, promotions, and purchase UI.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;mobile-rule&quot;&gt;&lt;b&gt;4&lt;/b&gt;&lt;div&gt;&lt;strong&gt;Keep proof beside the claim&lt;/strong&gt;&lt;p&gt;Reveal full methodology without hiding the headline result.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;div class=&quot;mobile-rule&quot;&gt;&lt;b&gt;5&lt;/b&gt;&lt;div&gt;&lt;strong&gt;Preserve state&lt;/strong&gt;&lt;p&gt;Selections, gallery, scroll, and accordions survive navigation.&lt;/p&gt;&lt;/div&gt;&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;mobile-psychology&quot;&gt;&lt;span class=&quot;text-small&quot;&gt;PSYCHOLOGY · COGNITIVE LOAD + MOTOR FLUENCY&lt;/span&gt;&lt;p&gt;&lt;b&gt;Shopper thought:&lt;/b&gt; “Can I understand and complete this with one thumb?” The scripts repeatedly connect low mobile conversion to buried buttons, inconsistent imagery, covered checkout controls, pop-up collisions, extra clicks, and missing payment methods. Mobile design is decision simplification—not desktop compression.&lt;/p&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;designer-note&quot; aria-label=&quot;Designer’s note and recreation guidance&quot;&gt;
    &lt;div class=&quot;designer-note-lead&quot;&gt;
      &lt;div class=&quot;note-monogram&quot;&gt;&lt;strong&gt;PAGE AUDITS&lt;/strong&gt;&lt;span&gt;27 identifiable commerce experiences&lt;br&gt;19 complete live module audits&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;designer-letter&quot;&gt;
        &lt;span class=&quot;text-small text-muted&quot;&gt;A NOTE FROM THE DESIGNER&lt;/span&gt;
        &lt;h2&gt;What the best product pages changed in my own process&lt;/h2&gt;
        &lt;blockquote&gt;High conversion was rarely the result of one aggressive trick. The strongest pages made the product easier to understand, easier to believe, and easier to buy—then gave each of those jobs a distinct visual moment.&lt;/blockquote&gt;
        &lt;p&gt;After comparing the clearest patterns across Hydrant, Graza, Everyday Dose, Carpe, Foton, AG1, Grüns, Eight Sleep, Medicube, Ninja, Tarte, Mielle, and the wider set, the lesson was not “make every page longer.” It was: sequence conviction deliberately. A section earns its place only when it answers the next unanswered buyer question.&lt;/p&gt;
        &lt;div class=&quot;signature&quot;&gt;— The designer, after the 27-page PDP review&lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;lesson-grid&quot;&gt;
      &lt;article class=&quot;lesson&quot;&gt;&lt;b&gt;1&lt;/b&gt;&lt;div&gt;&lt;strong&gt;Clarity is a luxury signal&lt;/strong&gt;&lt;p&gt;The best pages do not force shoppers to decode the product, configuration, value, or next action. Confidence begins with legibility.&lt;/p&gt;&lt;/div&gt;&lt;/article&gt;
      &lt;article class=&quot;lesson&quot;&gt;&lt;b&gt;2&lt;/b&gt;&lt;div&gt;&lt;strong&gt;Proof needs choreography&lt;/strong&gt;&lt;p&gt;Evidence works hardest when it immediately follows the risky claim it supports. A testimonial graveyard at the bottom is too late.&lt;/p&gt;&lt;/div&gt;&lt;/article&gt;
      &lt;article class=&quot;lesson&quot;&gt;&lt;b&gt;3&lt;/b&gt;&lt;div&gt;&lt;strong&gt;Rhythm prevents long-page fatigue&lt;/strong&gt;&lt;p&gt;Dense decision modules should alternate with immersive visual moments. Changing pace makes a thorough page feel intentional rather than endless.&lt;/p&gt;&lt;/div&gt;&lt;/article&gt;
      &lt;article class=&quot;lesson&quot;&gt;&lt;b&gt;4&lt;/b&gt;&lt;div&gt;&lt;strong&gt;The product remains the protagonist&lt;/strong&gt;&lt;p&gt;Art direction should frame product behavior, material, ritual, and result. Decorative spectacle without product causality is expensive noise.&lt;/p&gt;&lt;/div&gt;&lt;/article&gt;
      &lt;article class=&quot;lesson&quot;&gt;&lt;b&gt;5&lt;/b&gt;&lt;div&gt;&lt;strong&gt;Offer math is a design responsibility&lt;/strong&gt;&lt;p&gt;Total price, per-unit value, renewal cadence, savings, delivery, and cancellation belong in the interface—not in a shopper’s mental arithmetic.&lt;/p&gt;&lt;/div&gt;&lt;/article&gt;
      &lt;article class=&quot;lesson&quot;&gt;&lt;b&gt;6&lt;/b&gt;&lt;div&gt;&lt;strong&gt;Mobile must be recomposed&lt;/strong&gt;&lt;p&gt;The strongest mobile experience is not the desktop page stacked vertically. It edits media, shortens copy, preserves state, and protects the thumb zone.&lt;/p&gt;&lt;/div&gt;&lt;/article&gt;
      &lt;article class=&quot;lesson&quot;&gt;&lt;b&gt;7&lt;/b&gt;&lt;div&gt;&lt;strong&gt;Distinctiveness and conversion reinforce each other&lt;/strong&gt;&lt;p&gt;One repeated visual thesis improves memory and orientation. Consistency makes bold design easier—not harder—to navigate.&lt;/p&gt;&lt;/div&gt;&lt;/article&gt;
      &lt;article class=&quot;lesson&quot;&gt;&lt;b&gt;8&lt;/b&gt;&lt;div&gt;&lt;strong&gt;Risk belongs beside the decision&lt;/strong&gt;&lt;p&gt;Guarantees, shipping, fit, safety, compatibility, and subscription terms reduce anxiety only when they appear where that anxiety occurs.&lt;/p&gt;&lt;/div&gt;&lt;/article&gt;
    &lt;/div&gt;

    &lt;div class=&quot;recreation-plan&quot;&gt;
      &lt;div class=&quot;recreation-intro&quot;&gt;&lt;div&gt;&lt;span class=&quot;text-small&quot;&gt;HOW TO RECREATE THE SYSTEM&lt;/span&gt;&lt;h2&gt;Design the logic before decorating the page&lt;/h2&gt;&lt;/div&gt;&lt;p&gt;Treat this wireframe as a sequence of decisions, not a section template to copy verbatim.&lt;/p&gt;&lt;/div&gt;
      &lt;div class=&quot;recreation-steps&quot;&gt;
        &lt;div class=&quot;recreation-step&quot;&gt;&lt;b&gt;1&lt;/b&gt;&lt;div&gt;&lt;strong&gt;Write the buyer-question spine&lt;/strong&gt;&lt;span&gt;List every question between first impression and confident purchase. Put them in emotional order.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;recreation-step&quot;&gt;&lt;b&gt;2&lt;/b&gt;&lt;div&gt;&lt;strong&gt;Choose one ownable visual thesis&lt;/strong&gt;&lt;span&gt;A crop, shape, texture, grid, illustration style, or motion behavior should organize the page.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;recreation-step&quot;&gt;&lt;b&gt;3&lt;/b&gt;&lt;div&gt;&lt;strong&gt;Map every claim to evidence&lt;/strong&gt;&lt;span&gt;Use lived experience, testing, experts, materials, or demonstrations according to the risk of the claim.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;recreation-step&quot;&gt;&lt;b&gt;4&lt;/b&gt;&lt;div&gt;&lt;strong&gt;Art-direct three high-leverage moments&lt;/strong&gt;&lt;span&gt;Spend the most creative energy on the hero, the mechanism, and the strongest proof story.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;recreation-step&quot;&gt;&lt;b&gt;5&lt;/b&gt;&lt;div&gt;&lt;strong&gt;De-risk locally&lt;/strong&gt;&lt;span&gt;Place shipping, returns, guarantees, compatibility, and renewal terms near the choice they affect.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;recreation-step&quot;&gt;&lt;b&gt;6&lt;/b&gt;&lt;div&gt;&lt;strong&gt;Measure the decision sequence&lt;/strong&gt;&lt;span&gt;Track configuration completion, proof engagement, comparison use, objection views, add to cart, and checkout—not button color alone.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
        &lt;div class=&quot;recreation-step&quot;&gt;&lt;b&gt;7&lt;/b&gt;&lt;div&gt;&lt;strong&gt;Subtract until every section earns the scroll&lt;/strong&gt;&lt;span&gt;If a module does not add desire, belief, clarity, or safety, combine it or remove it.&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;designer-warning&quot;&gt;&lt;strong&gt;The most important warning:&lt;/strong&gt; do not copy the number of sections, the pastel palette, or the exact layouts. Copy the reasoning. Your final page should feel unmistakably like the product and brand it is selling. Psychology should remove confusion and honest uncertainty—not manufacture anxiety, false scarcity, or proof that does not exist.&lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
